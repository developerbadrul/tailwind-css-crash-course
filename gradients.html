<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradients</title>
    <link rel="stylesheet" href="dist/output.css">
</head>

<body>
    <main>
        <div class="max-w-3xl mx-auto p-12 bg-slate-900 min-h-screen space-y-12 font-sans">

            <!-- 1. Text Gradient -->
            <h1
                class="text-5xl font-extrabold bg-linear-to-r from-pink-500 to-violet-500 bg-clip-text text-transparent">
                Supercharge Your Workflow
            </h1>

            <!-- 2. Gradient Button -->
            <button
                class="px-8 py-3 rounded-full font-bold text-white shadow-lg bg-linear-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 transition-all transform hover:scale-105">Get
                Started</button>

            <!-- 3. Three-Color Background Card -->
            <div
                class="bg-linear-to-br from-indigo-600 via-purple-600 to-pink-500 p-8 rounded-2xl shadow-xl text-white">
                <h3 class="font-bold text-2xl mb-2">Premium Feature</h3>
                <p class="text-white/80">Unlock all the advanced tools with our pro plan.</p>
            </div>

            <!-- 4. Gradient Border Card (Trick) -->
            <div class="p-0.5 rounded-2xl bg-linear-to-r from-rose-400 via-fuchsia-500 to-indigo-500">
                <div class="bg-slate-900 p-8 rounded-2xl h-full w-full">
                    <h3 class="font-bold text-xl text-white mb-2">Gradient Border</h3>
                    <p class="text-slate-400">This card uses a wrapper trick to create a gradient border.</p>
                </div>
            </div>

            <!-- 5. Image Overlay Gradient -->
            <div class="relative rounded-2xl overflow-hidden shadow-2xl group cursor-pointer h-64">
                <img class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
                    src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=600&q=80" alt="Tech Background">
                <div
                    class="absolute inset-0 bg-linear-to-t from-slate-900 via-slate-900/40 to-transparent flex items-end p-6">
                    <h2 class="text-3xl font-bold text-white">Discover the Future</h2>
                </div>
            </div>

        </div>
    </main>
</body>

</html>
