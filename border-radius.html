<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders & Radius</title>
    <link rel="stylesheet" href="dist/output.css">
</head>

<body>

    <main>
        <div class="max-w-3xl mx-auto p-8 space-y-12 font-sans text-slate-800">
            <div class="border border-slate-300 rounded-xl p-6 bg-white shadow-sm">
                <h3 class="font-bold text-lg mb-2">Standard Card</h3>
                <p class="text-slate-500">A normal card with a subtle border and rounded corners.</p>
            </div>


            <img src="https://i.pravatar.cc/150?img=11"
                class="w-24 h-24 border-4 border-indigo-500 rounded-full object-cover" alt="Avatar">

            <div
                class="border-2 border-dashed border-slate-400 rounded-lg p-10 text-center bg-slate-50 hover:bg-slate-100">
                <p class="text-slate-500 font-medium">Drag and drop files here</p>
            </div>

            <span
                class="border border-emerald-500 text-emerald-700 bg-emerald-50 rounded-full px-4 py-1 text-sm font-bold">Active
                User</span>


            <div class="border-b border-slate-200 flex gap-4">
                <span class="border-b-2 border-blue-600 pb-2 text-blue-600 font-medium cursor-pointer">Active Tab</span>
                <span class="pb-2 text-slate-500 hover:text-slate-800 cursor-pointer">Inactive Tab</span>
            </div>

            <div class="bg-blue-500 text-white p-4 rounded-2xl rounded-br-none max-w-xs shadow-md">
                <p>Hello! How can I help you today?</p>
            </div>
        </div>
    </main>
</body>

</html>
